# Notification service pipeline.
#
# Lint, test, then build the image. The tests need no database and no broker: every
# dependency is behind a port with an in-memory fake, which is what makes this fast
# enough to run on every push.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Test
        run: pytest -q

      - name: Every log call survives a configured logger
        # `extra={"created": ...}` collides with a field `logging.LogRecord` already has, and
        # `logging` raises KeyError rather than shadowing it. The failure is invisible in a test
        # process — an un-configured logger sits at WARNING and never builds the record — and fatal
        # in a container at INFO, where it would have made every recorded notification dead-letter
        # its event. tests/test_wiring.py scans for it; this runs the log statements for real.
        run: |
          python - <<'PY'
          import asyncio, logging, sys

          # INFO is what a container runs at, and the level is the whole point: at WARNING the
          # record is never built and the collision never happens.
          logging.basicConfig(level=logging.INFO)
          # An editable install exposes app/ but not tests/, and the fakes live there.
          sys.path.insert(0, ".")
          from app.application.notification_service import NotificationService
          from app.domain import translation
          from tests.fakes import (
              FakeUnitOfWork, FixedClock, InMemoryNotificationRepository, sequential_ids,
          )

          uow = FakeUnitOfWork()
          service = NotificationService(
              uow=uow,
              notifications=InMemoryNotificationRepository(uow),
              clock=FixedClock(),
              new_id=sequential_ids(),
          )
          created = asyncio.run(service.record(
              event_id="ci-event",
              event_type=translation.ORDER_GIFT_SENT,
              payload={
                  "order_id": "o-1", "sender_id": "b-1", "recipient_id": "r-1",
                  "game_title": "CI", "message": "",
              },
          ))
          assert created == 2, created
          print("log statements execute cleanly at INFO")
          PY

      - name: Migrations are append-only
        # An applied migration whose contents changed would leave two environments
        # quietly different, so the runner refuses it at boot. This catches the edit in
        # review instead.
        run: |
          if git rev-parse origin/main >/dev/null 2>&1; then
            changed=$(git diff --name-only --diff-filter=M origin/main...HEAD -- migrations/ || true)
            if [ -n "$changed" ]; then
              echo "these applied migrations were edited; add a new file instead:"
              echo "$changed"
              exit 1
            fi
          fi
          echo "no migration was edited in place"

  image:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build
        # load=true so the smoke test can run the image locally. push and load cannot
        # share one buildx export, so registry publish is a separate step after smoke.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            arcadia/notification-service:${{ github.sha }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image starts and reports unready without a database
        # A container that cannot reach Postgres must report DOWN rather than UP. This is
        # the check that would have caught a readiness probe wired to nothing.
        run: |
          docker run -d --name notification \
            -e DATABASE_URL=postgresql://nobody:nobody@127.0.0.1:5432/nothing \
            -e JWT_SECRET=ci-only-secret-at-least-32-characters-long \
            -e KAFKA_ENABLED=false \
            -e RUN_MIGRATIONS=false \
            -p 8086:8086 \
            arcadia/notification-service:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf localhost:8086/livez >/dev/null; then break; fi
            sleep 1
          done
          # Dump the container's own output before asserting. A container that dies on import
          # never answers /livez, and `curl -sf | grep` under `set -e` then fails the step with
          # nothing on screen but a container id — the traceback naming the missing module is
          # right here and is the whole diagnosis.
          curl -sf localhost:8086/livez | grep -q UP || {
            echo "no UP from /livez after 30s; the container said:"
            docker logs notification
            exit 1
          }
          echo "liveness is up"
          rc=$(curl -s -o /dev/null -w '%{http_code}' localhost:8086/readyz)
          [ "$rc" = "503" ] || { echo "expected 503 from /readyz, got $rc"; docker logs notification; exit 1; }
          echo "readiness correctly reports 503 with no database"

      - name: A request without a token is refused rather than 500
        # The whole API is behind authentication and there is no database in this job, so a
        # 401 also proves the refusal happens in a dependency before anything reaches Postgres.
        run: |
          rc=$(curl -s -o /dev/null -w '%{http_code}' localhost:8086/v1/notifications)
          [ "$rc" = "401" ] || { echo "expected 401, got $rc"; docker logs notification; exit 1; }
          echo "the API is closed by default"
          docker rm -f notification

      - name: Push to the registry
        # A pull request gets its image built and smoked — proving the Dockerfile still
        # works — but never pushed.
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done

  deploy:
    name: Deploy to arcadia
    runs-on: ubuntu-latest
    needs: [image]
    # Only a real push to main gets rolled out — not a PR build, not a tag build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Configure kubectl credentials
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.ARCADIA_KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      # `set image` wouldn't trigger a rollout here: the tag is always :latest, so
      # the pod template's image string never changes. `rollout restart` forces new
      # pods regardless, and imagePullPolicy: Always (the default for :latest) means
      # they pull the image this workflow just pushed.
      - name: Roll out notification-service
        run: |
          kubectl -n arcadia rollout restart deployment/notification-service
          kubectl -n arcadia rollout status deployment/notification-service --timeout=180s
